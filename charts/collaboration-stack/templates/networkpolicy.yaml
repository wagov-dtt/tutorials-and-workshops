# NetworkPolicy complements Linkerd policy for clusters with CNI enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collaboration-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collaboration-allow-traefik-to-apps
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - bookstack
          - kanboard
          - forgejo
{{- if .Values.sso.enabled }}
          - keycloak
          - oauth2-proxy
{{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: traefik
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collaboration-allow-same-namespace-to-traefik
spec:
  podSelector:
    matchLabels:
      app: traefik
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collaboration-allow-app-to-db
spec:
  podSelector:
    matchLabels:
      app: bookstack-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bookstack
