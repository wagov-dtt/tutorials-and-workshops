# Default-deny ingress for EKS-facing demo workloads. The allow rule keeps traffic
# inside the release namespace for MySQL, jobs, and debug pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3-test-default-deny-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3-test-allow-same-namespace
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
