# MySQL (Percona 8.0) with sysbench test data
{{- $mysqlSecret := lookup "v1" "Secret" .Release.Namespace "mysql-secret" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}
stringData:
  MYSQL_ROOT_PASSWORD: {{ if $mysqlSecret }}{{ index $mysqlSecret.data "MYSQL_ROOT_PASSWORD" | b64dec | quote }}{{ else }}{{ randAlphaNum 24 | quote }}{{ end }}
  MYSQL_DATABASE: sbtest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mysql
        image: percona:8.0
        ports:
        - containerPort: 3306
        envFrom:
        - secretRef:
            name: mysql-secret
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["sh", "-lc", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-lc", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
          initialDelaySeconds: 30
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sysbench-prepare
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-mysql
        image: percona:8.0
        env:
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        command: ["sh", "-c", "until mysqladmin ping -h mysql -u root; do sleep 2; done"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      containers:
      - name: sysbench
        image: perconalab/sysbench:1.1
        env:
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        command: ["sysbench"]
        args: ["--db-driver=mysql", "--mysql-host=mysql", "--mysql-user=root",
               "--mysql-db=sbtest",
               "--tables=2", "--table-size=1000", "oltp_read_write", "prepare"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
