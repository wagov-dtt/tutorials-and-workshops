# ExternalSecret - references a secret in AWS Secrets Manager
# Creates a K8s Secret named 'db-creds' in the release namespace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    # K8s Secret name that will be created
    name: db-creds
    creationPolicy: Owner
  data:
    # Map AWS secret JSON keys to K8s Secret keys
    - secretKey: username
      remoteRef:
        key: {{ .Values.remoteSecret.key | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.remoteSecret.key | quote }}
        property: password
