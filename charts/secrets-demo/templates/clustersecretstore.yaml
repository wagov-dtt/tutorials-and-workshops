# SecretStore is namespace-scoped by default to keep the demo blast radius local.
# Set secretStore.kind=ClusterSecretStore only when teaching cluster-wide reuse.
apiVersion: external-secrets.io/v1beta1
kind: {{ .Values.secretStore.kind }}
metadata:
  name: {{ .Values.secretStore.name }}
{{- if eq .Values.secretStore.kind "SecretStore" }}
  namespace: {{ .Release.Namespace }}
{{- end }}
spec:
  provider:
    aws:
      service: SecretsManager
      auth:
        # Pod Identity - no credentials stored, uses IAM role
        # Requires Pod Identity association for external-secrets SA
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
