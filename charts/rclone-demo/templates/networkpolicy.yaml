# NetworkPolicy is a teaching baseline; kind's default CNI does not enforce it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rclone-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rclone-allow-filebrowser-to-s3
spec:
  podSelector:
    matchLabels:
      app: serves3
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: filebrowser
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rclone-allow-same-namespace-ui
spec:
  podSelector:
    matchLabels:
      app: filebrowser
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 80
