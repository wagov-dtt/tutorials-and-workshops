# NetworkPolicy is ignored by kind's default CNI, but documents the intended boundary
# for clusters with NetworkPolicy enforcement: only in-namespace clients may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: databases-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: databases-allow-same-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
