# Overlay that fans out all telemetry to S3 as OTLP JSON, partitioned by signal.
config:
  exporters:
    awss3:
      s3uploader:
        region: ${env:OBSERVABILITY_S3_REGION}
        s3_bucket: ${env:OBSERVABILITY_S3_BUCKET}
        s3_base_prefix: ${env:OBSERVABILITY_S3_BASE_PREFIX}
        s3_prefix: default
        s3_partition_format: year=%Y/month=%m/day=%d/hour=%H
        s3_partition_timezone: UTC
        compression: gzip
      resource_attrs_to_s3:
        s3_prefix: observability.s3_prefix
      sending_queue:
        enabled: true
      retry_on_failure:
        enabled: true

  service:
    pipelines:
      metrics:
        exporters: [otlphttp/victoriametrics, awss3]
      logs:
        exporters: [otlphttp/victorialogs, awss3]
      traces:
        exporters: [otlphttp/victoriatraces, awss3]
